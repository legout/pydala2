[project]
name = "pydala2"
version = "0.29.1"
description = "poor man´s data lake"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Volker L.", email = "ligno.blades@gmail.com" }]
dependencies = [
  "brotli>=1.2.1",
  "duckdb>=1.4.0",
  "fsspec>=2025.1.0",
  "fsspeckit>=0.27.1",
  "loguru>=0.7.2",
  "munch>=4.0.0",
  "pandas>=2.3.3",
  "polars>=1.35.2",
  "psutil>=6.0.0",
  "pyarrow>=22.0.0",
  "pyyaml>=6.0.2",
  "sqlglot>=27.16.3",
  "tqdm>=4.65.0",
]

[project.urls]
Repository = "https://github.com/legout/pydala2"
Issues = "https://github.com/legout/pydala2/issues"

[project.optional-dependencies]
s3 = ["fsspec[s3]>=2025.1.0"]
sftp = ["paramiko>=5.0.0"]

[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pydala"]

[tool.hatch.build.targets.sdist]
exclude = ["/.pi", "/notebooks", "/scratch"]

[dependency-groups]
test = [
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
]

docs = [
  "mkdocs>=1.6.1",
  "mkdocs-git-revision-date-localized-plugin>=1.4.7",
  "mkdocs-material>=9.6.20",
  "mkdocs-material-extensions>=1.3.1",
  "mkdocs-mermaid2-plugin>=1.2.2",
  "mkdocstrings[python]>=0.30.1",
  "pymdown-extensions>=10.0.0",
]

notebook = [
  "ipython>=9.16.1",
  "jupyterlab>=4.4.7",
  "marimo>=0.15.3",
]

dev = [
  { include-group = "test" },
  { include-group = "docs" },
  { include-group = "notebook" }
]
